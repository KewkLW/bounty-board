<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Management - Wasteland Bounty Board</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Courier New', monospace;
      background: #0a0e27;
      color: #e0e0e0;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      border-bottom: 2px solid #00ff00;
      padding-bottom: 20px;
      margin-bottom: 30px;
    }

    h1 {
      color: #00ff00;
      font-size: 32px;
      text-shadow: 0 0 10px #00ff00;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #888;
      font-size: 14px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: rgba(0, 255, 0, 0.05);
      border: 1px solid #00ff00;
      padding: 15px;
      border-radius: 5px;
      text-align: center;
    }

    .stat-value {
      font-size: 24px;
      color: #00ff00;
      font-weight: bold;
    }

    .stat-label {
      color: #888;
      font-size: 12px;
      margin-top: 5px;
    }

    .agents-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 15px;
    }

    .agent-card {
      background: rgba(0, 255, 0, 0.02);
      border: 2px solid #444;
      border-radius: 5px;
      padding: 15px;
      transition: all 0.3s ease;
    }

    .agent-card:hover {
      border-color: #00ff00;
      box-shadow: 0 0 10px rgba(0, 255, 0, 0.2);
    }

    .agent-card.status-online {
      border-color: #00ff00;
      background: rgba(0, 255, 0, 0.05);
    }

    .agent-card.status-active {
      border-color: #ffff00;
      background: rgba(255, 255, 0, 0.05);
    }

    .agent-card.status-idle {
      border-color: #0080ff;
      background: rgba(0, 128, 255, 0.05);
    }

    .agent-card.status-offline {
      border-color: #ff0000;
      background: rgba(255, 0, 0, 0.02);
    }

    .agent-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 10px;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
    }

    .agent-name {
      font-size: 16px;
      font-weight: bold;
      color: #e0e0e0;
    }

    .agent-status {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .status-online {
      background: #00ff00;
      color: #0a0e27;
    }

    .status-active {
      background: #ffff00;
      color: #0a0e27;
    }

    .status-idle {
      background: #0080ff;
      color: #fff;
    }

    .status-offline {
      background: #ff0000;
      color: #fff;
    }

    .agent-info {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 8px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
    }

    .info-label {
      color: #666;
    }

    .info-value {
      color: #e0e0e0;
      font-weight: bold;
    }

    .agent-bounty {
      background: rgba(255, 255, 0, 0.1);
      border-left: 2px solid #ffff00;
      padding: 8px;
      margin: 8px 0;
      font-size: 11px;
      border-radius: 2px;
    }

    .bounty-id {
      color: #ffff00;
      font-weight: bold;
    }

    .agent-controls {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #333;
    }

    button {
      flex: 1;
      padding: 6px 10px;
      border: 1px solid;
      border-radius: 3px;
      cursor: pointer;
      font-size: 11px;
      font-family: 'Courier New', monospace;
      transition: all 0.2s;
      text-transform: uppercase;
      font-weight: bold;
    }

    .btn-deactivate {
      background: rgba(255, 0, 0, 0.2);
      border-color: #ff0000;
      color: #ff0000;
    }

    .btn-deactivate:hover {
      background: rgba(255, 0, 0, 0.4);
    }

    .btn-reactivate {
      background: rgba(0, 255, 0, 0.2);
      border-color: #00ff00;
      color: #00ff00;
    }

    .btn-reactivate:hover {
      background: rgba(0, 255, 0, 0.4);
    }

    .timestamp {
      font-size: 10px;
      color: #666;
      margin-top: 8px;
    }

    .connection-status {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 10px 15px;
      border-radius: 3px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .connection-status.connected {
      background: rgba(0, 255, 0, 0.2);
      border: 1px solid #00ff00;
      color: #00ff00;
    }

    .connection-status.disconnected {
      background: rgba(255, 0, 0, 0.2);
      border: 1px solid #ff0000;
      color: #ff0000;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .connection-status.connected .dot {
      background: #00ff00;
      box-shadow: 0 0 5px #00ff00;
    }

    .connection-status.disconnected .dot {
      background: #ff0000;
      box-shadow: 0 0 5px #ff0000;
    }

    @media (max-width: 768px) {
      .agents-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="connection-status disconnected" id="connStatus">
    <span class="dot"></span>
    <span>Disconnected</span>
  </div>

  <div class="container">
    <header>
      <h1>🤖 AGENT COMMAND CENTER</h1>
      <p class="subtitle">Real-time agent management and monitoring</p>
    </header>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-value" id="totalAgents">0</div>
        <div class="stat-label">TOTAL AGENTS</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="onlineAgents">0</div>
        <div class="stat-label">ONLINE</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="activeAgents">0</div>
        <div class="stat-label">ACTIVE (WORKING)</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="idleAgents">0</div>
        <div class="stat-label">IDLE (WAITING)</div>
      </div>
    </div>

    <div class="agents-grid" id="agentsContainer"></div>
  </div>

  <script>
    let ws = null;
    const agentCards = new Map();

    function connectWebSocket() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}`;

      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        console.log('[WS] Connected');
        updateConnectionStatus(true);
      };

      ws.onclose = () => {
        console.log('[WS] Disconnected');
        updateConnectionStatus(false);
        setTimeout(connectWebSocket, 3000); // Reconnect after 3s
      };

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);

          if (msg.type === 'agent_status_changed') {
            updateAgentStatus(msg.data.agentId, msg.data.status, msg.data.bountyId);
          }

          if (msg.type === 'agent_offline') {
            updateAgentStatus(msg.data.agentId, 'offline');
          }

          if (msg.type === 'agent_online') {
            updateAgentStatus(msg.data.agentId, 'online');
          }
        } catch (err) {
          console.error('Error parsing WebSocket message:', err);
        }
      };

      ws.onerror = (err) => {
        console.error('[WS] Error:', err);
      };
    }

    function updateConnectionStatus(connected) {
      const el = document.getElementById('connStatus');
      el.className = `connection-status ${connected ? 'connected' : 'disconnected'}`;
      el.innerHTML = `<span class="dot"></span><span>${connected ? 'Connected' : 'Disconnected'}</span>`;
    }

    async function loadAgents() {
      try {
        const res = await fetch('/api/agents/status/all');
        const agents = await res.json();

        // Clear old cards
        document.getElementById('agentsContainer').innerHTML = '';
        agentCards.clear();

        agents.forEach(agent => {
          createAgentCard(agent);
        });

        updateStats();
      } catch (err) {
        console.error('Error loading agents:', err);
      }
    }

    function createAgentCard(agent) {
      const container = document.getElementById('agentsContainer');
      const card = document.createElement('div');
      const statusClass = `status-${agent.status || 'offline'}`;
      card.className = `agent-card ${statusClass}`;
      card.id = `agent-${agent.agentId}`;

      const lastSeen = agent.lastSeen ? new Date(agent.lastSeen).toLocaleTimeString() : 'N/A';
      const currentBounty = agent.currentBountyId ? `#${agent.currentBountyId}` : 'None';

      card.innerHTML = `
        <div class="agent-header">
          <div class="agent-name">${agent.agentId}</div>
          <div class="agent-status status-${agent.status || 'offline'}">
            ${(agent.status || 'offline').toUpperCase()}
          </div>
        </div>

        <div class="agent-info">
          <div class="info-row">
            <span class="info-label">Class:</span>
            <span class="info-value">${agent.class || 'Unknown'}</span>
          </div>
          <div class="info-row">
            <span class="info-label">Active:</span>
            <span class="info-value">${agent.isActive ? 'Yes' : 'No'}</span>
          </div>
          <div class="info-row">
            <span class="info-label">Current Work:</span>
            <span class="info-value">${currentBounty}</span>
          </div>
          <div class="info-row">
            <span class="info-label">Last Seen:</span>
            <span class="info-value">${lastSeen}</span>
          </div>
        </div>

        ${agent.currentBountyId ? `
          <div class="agent-bounty">
            Working on bounty <span class="bounty-id">#${agent.currentBountyId}</span>
          </div>
        ` : ''}

        <div class="agent-controls">
          ${agent.isActive ? `
            <button class="btn-deactivate" onclick="deactivateAgent('${agent.agentId}')">
              Deactivate
            </button>
          ` : `
            <button class="btn-reactivate" onclick="reactivateAgent('${agent.agentId}')">
              Reactivate
            </button>
          `}
        </div>

        <div class="timestamp">Updated: ${new Date().toLocaleTimeString()}</div>
      `;

      container.appendChild(card);
      agentCards.set(agent.agentId, { card, agent });
    }

    function updateAgentStatus(agentId, status, bountyId = null) {
      const cardData = agentCards.get(agentId);
      if (cardData) {
        cardData.agent.status = status;
        cardData.agent.currentBountyId = bountyId;
        cardData.agent.lastSeen = Date.now();

        // Update card classes
        cardData.card.className = `agent-card status-${status}`;

        // Update content
        const lastSeen = new Date().toLocaleTimeString();
        const currentBounty = bountyId ? `#${bountyId}` : 'None';

        cardData.card.innerHTML = `
          <div class="agent-header">
            <div class="agent-name">${agentId}</div>
            <div class="agent-status status-${status}">
              ${status.toUpperCase()}
            </div>
          </div>

          <div class="agent-info">
            <div class="info-row">
              <span class="info-label">Class:</span>
              <span class="info-value">${cardData.agent.class || 'Unknown'}</span>
            </div>
            <div class="info-row">
              <span class="info-label">Active:</span>
              <span class="info-value">${cardData.agent.isActive ? 'Yes' : 'No'}</span>
            </div>
            <div class="info-row">
              <span class="info-label">Current Work:</span>
              <span class="info-value">${currentBounty}</span>
            </div>
            <div class="info-row">
              <span class="info-label">Last Seen:</span>
              <span class="info-value">${lastSeen}</span>
            </div>
          </div>

          ${bountyId ? `
            <div class="agent-bounty">
              Working on bounty <span class="bounty-id">#${bountyId}</span>
            </div>
          ` : ''}

          <div class="agent-controls">
            ${cardData.agent.isActive ? `
              <button class="btn-deactivate" onclick="deactivateAgent('${agentId}')">
                Deactivate
              </button>
            ` : `
              <button class="btn-reactivate" onclick="reactivateAgent('${agentId}')">
                Reactivate
              </button>
            `}
          </div>

          <div class="timestamp">Updated: ${lastSeen}</div>
        `;

        updateStats();
      }
    }

    async function deactivateAgent(agentId) {
      try {
        await fetch(`/api/agents/${agentId}/deactivate`, { method: 'POST' });
        console.log(`Deactivated: ${agentId}`);
      } catch (err) {
        console.error('Error deactivating agent:', err);
      }
    }

    async function reactivateAgent(agentId) {
      try {
        await fetch(`/api/agents/${agentId}/reactivate`, { method: 'POST' });
        console.log(`Reactivated: ${agentId}`);
      } catch (err) {
        console.error('Error reactivating agent:', err);
      }
    }

    function updateStats() {
      const agents = Array.from(agentCards.values()).map(d => d.agent);

      const total = agents.length;
      const online = agents.filter(a => a.status && a.status !== 'offline').length;
      const active = agents.filter(a => a.status === 'active').length;
      const idle = agents.filter(a => a.status === 'idle').length;

      document.getElementById('totalAgents').textContent = total;
      document.getElementById('onlineAgents').textContent = online;
      document.getElementById('activeAgents').textContent = active;
      document.getElementById('idleAgents').textContent = idle;
    }

    // Initial load and WebSocket connection
    loadAgents();
    connectWebSocket();

    // Refresh agent list every 10 seconds
    setInterval(loadAgents, 10000);
  </script>
</body>
</html>
