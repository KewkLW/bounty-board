<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Roster · It's not a Kanban</title>
<link rel="icon" href="/img/favicon.png" type="image/png"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="/op-theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<link href="/op.css" rel="stylesheet"/>
<script src="/avatars.js"></script>
<style>
.ro-card { overflow: visible; }
.ro-stage {
  position: relative; padding: 14px 14px 0; display: flex; justify-content: center;
  background: radial-gradient(70% 70% at 50% 40%, color-mix(in srgb, var(--accent, #7aa2f7) 22%, transparent), transparent 70%);
  border-radius: 8px 8px 0 0;
}
.ro-portrait { width: 100%; aspect-ratio: 3 / 4; max-width: 240px; }
.ro-badge {
  position: absolute; top: -10px; right: -8px; z-index: 20; padding: 3px 10px; border-radius: 5px;
  font: 700 10px/1.4 "Chakra Petch", Inter, sans-serif; letter-spacing: .12em; text-transform: uppercase;
  border: 1px solid #0b0b10; box-shadow: 0 4px 12px rgba(0,0,0,.6);
}
.ro-filter {
  flex: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; white-space: nowrap;
  font: 700 11px/1 "Chakra Petch", Inter, sans-serif; letter-spacing: .1em; text-transform: uppercase;
  color: #a9b1d6; background: rgba(26,27,38,.85); border: 1px solid rgba(122,162,247,.22);
}
.ro-filter:hover { color: #fff; border-color: rgba(122,162,247,.5); }
.ro-filter.on { color: #0b0b10; background: linear-gradient(180deg, #a6bfff, #7aa2f7 55%, #5a7bc4); border-color: #0b0b10; }
.ro-stat { background: rgba(9,9,14,.55); border: 1px solid rgba(122,162,247,.14); border-radius: 5px; padding: 5px 2px; }
.ro-stat span:first-child { display: block; font: 600 9px/1.2 "JetBrains Mono", monospace; letter-spacing: .1em; text-transform: uppercase; color: #565f89; }
.ro-rate { height: 4px; background: rgba(9,9,14,.7); border-radius: 2px; overflow: hidden; }
</style>
</head>
<body class="bg-background-dark min-h-screen text-gray-100 font-display relative overflow-x-hidden">
<div class="grunge fixed inset-0 z-50 mix-blend-overlay"></div>

<div class="op-bar" aria-hidden="true">
  <div class="ws" id="opbar-ws"></div>
  <div class="mid"><b>bounty-board</b> · roster · wasteland command</div>
  <div class="tray"><span class="material-icons">wifi</span><span class="material-icons">battery_full</span><span class="date" id="opbar-date"></span><span class="clock" id="opbar-clock">--:--</span></div>
</div>

<header class="op-header px-3 md:px-6 py-3 flex flex-wrap items-center gap-x-5 gap-y-3 justify-between">
  <a class="op-brand" href="/" title="Back to the board">
    <span class="op-mark" aria-hidden="true"></span>
    <div class="min-w-0">
      <h1 class="op-title"><span class="t">Roster</span></h1>
      <div class="op-sub"><b>Wasteland Command</b> · every slot, every agent · <span class="text-green-400">&#9679; online</span></div>
    </div>
  </a>
  <div class="grid grid-cols-2 w-full sm:w-auto sm:flex gap-2">
    <div class="op-stat"><span class="material-icons">palette</span><div><span class="lbl">Slots</span><span id="stat-total" class="val">--</span></div></div>
    <div class="op-stat"><span class="material-icons">terminal</span><div><span class="lbl">Focused now</span><span id="stat-active" class="val text-primary">--</span></div></div>
  </div>
</header>

<div class="relative z-10 container mx-auto px-3 md:px-4 py-6 pb-32 max-w-7xl">
  <!-- Filters -->
  <div id="filters" class="mb-6 flex gap-2 overflow-x-auto pb-2"></div>

  <!-- Roster Grid -->
  <div id="roster" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 md:gap-7 pt-3"></div>
</div>

<nav class="op-dock-wrap" aria-label="Pages">
  <div class="op-dock">
    <a href="/" title="Board"><span class="material-icons">grid_view</span>Board</a>
    <a href="/live" title="Live: what every agent is doing now"><span class="material-icons">phonelink_ring</span>Live</a>
    <a href="/status.html" title="Status: goals and progress"><span class="material-icons">flag</span>Status</a>
    <a href="/roster" class="on" title="Roster: the slots"><span class="material-icons">palette</span>Roster</a>
    <a href="/leaderboard" title="Leaderboard: loot from verified work"><span class="material-icons">emoji_events</span>Loot</a>
  </div>
</nav>

<script>
let currentFilter = 'all';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const AV = () => window.OPAvatars;

function statusBadge(s) {
  const map = {
    active: { cls: 'bg-primary text-black', label: 'FOCUSED' },
    idle: { cls: 'bg-gray-700 text-gray-200', label: 'IDLE' },
    repairing: { cls: 'bg-orange-500 text-black', label: 'REPAIRING' },
    offline: { cls: 'bg-red-600 text-white', label: 'OFFLINE' },
  };
  const m = map[s] || map.offline;
  return `<div class="ro-badge ${m.cls}">${m.label}</div>`;
}

function statusAccent(s) {
  return { active: 'bg-primary', idle: 'bg-gray-500', repairing: 'bg-orange-500', offline: 'bg-red-600' }[s] || 'bg-gray-500';
}

function actionButton(a) {
  if (a.status === 'repairing') {
    return `<button class="w-full op-btn ghost opacity-60 cursor-not-allowed"><span class="material-icons text-base">build</span> Maintenance</button>`;
  }
  if (a.status === 'idle') {
    return `<button class="w-full op-btn ghost"><span class="material-icons text-base">bolt</span> Assign a bounty</button>`;
  }
  return `<button class="w-full op-btn"><span class="material-icons text-base">phonelink_ring</span> Ping slot</button>`;
}

function tickClock() {
  const d = new Date();
  document.getElementById('opbar-clock').textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  document.getElementById('opbar-date').textContent = d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
}
tickClock(); setInterval(tickClock, 10000);

async function loadRoster() {
  const agents = await fetch('/api/agents').then(r => r.json());

  const counts = { all: agents.length, active: 0, idle: 0, repairing: 0, offline: 0 };
  agents.forEach(a => counts[a.status] = (counts[a.status] || 0) + 1);

  document.getElementById('stat-total').textContent = agents.length;
  document.getElementById('stat-active').textContent = counts.active;
  document.getElementById('opbar-ws').innerHTML = agents.map((a, i) => `<i class="${a.status === 'active' ? 'on' : a.status !== 'idle' ? 'has' : ''}" title="${esc(AV() ? AV().name(a.id, a.name) : a.name)}: ${esc(a.status)}">${i + 1}</i>`).join('');

  // Build filters
  document.getElementById('filters').innerHTML = ['all', 'active', 'idle', 'repairing'].map(f => {
    const isActive = f === currentFilter;
    const label = f === 'all' ? `All slots [${counts.all}]` : `${f === 'active' ? 'Focused' : f.charAt(0).toUpperCase() + f.slice(1)} [${counts[f] || 0}]`;
    return `<button onclick="setFilter('${f}')" class="ro-filter ${isActive ? 'on' : ''}">${label}</button>`;
  }).join('');

  // Filter agents
  const filtered = currentFilter === 'all' ? agents : agents.filter(a => a.status === currentFilter);

  const successRate = (a) => (a.missions_completed + a.missions_failed) > 0
    ? Math.round(a.missions_completed / (a.missions_completed + a.missions_failed) * 100) : 0;

  document.getElementById('roster').innerHTML = filtered.map(a => {
    const rate = successRate(a);
    const accent = statusAccent(a.status);
    const directive = a.current_directive || (a.status === 'idle' ? 'Idle. Nothing ready for this slot.' : a.status === 'repairing' ? 'Diagnostic in progress...' : 'Standing by.');
    const name = AV() ? AV().name(a.id, a.name) : a.name;
    const theme = AV() ? AV().theme(a.id) : '';
    const color = AV() ? AV().accent(a.id) : '#7aa2f7';
    const portrait = AV() ? AV().portrait(a.id) : (a.avatar_url || '');
    const fb = AV() ? AV().fallback(a.id, a.avatar_url) : `onerror="this.style.display='none'"`;
    const lit = a.status === 'active';

    return `<div class="ro-card op-win ${lit ? 'focus' : ''} shadow-cel-lg relative" style="--accent:${color}">
      ${statusBadge(a.status)}
      <div class="ro-stage">
        <span class="op-portrait ro-portrait"><img src="${esc(portrait)}" alt="${esc(name)}" ${fb}/></span>
      </div>
      <div class="p-4 space-y-3">
        <div class="text-center">
          <h3 class="op-display text-2xl font-bold uppercase" style="color:${color}">${esc(name)}</h3>
          <div class="op-theme-tag mt-1" title="${esc(a.id)}">${esc(a.id)} · <b>${esc(theme)}</b> · ${esc(a.runner || '')}${a.model ? ' · ' + esc(a.model) : ''}</div>
          <div class="flex justify-center mt-2">${AV() ? AV().swatches(a.id, 'lg') : ''}</div>
          <div class="text-[11px] text-gray-400 mt-2 flex items-center justify-center gap-1"><span class="text-primary font-mono">Lv.${esc(a.level)}</span> · <span class="material-icons text-[13px] text-warning">toll</span>${a.total_loot.toLocaleString()} loot from verified work</div>
          <div class="ro-rate mt-2"><div class="h-full ${accent}" style="width:${rate}%"></div></div>
        </div>
        <div class="op-sunk p-2.5">
          <p class="text-[9.5px] font-mono tracking-widest text-gray-500 uppercase font-bold mb-1">Current window</p>
          <p class="text-sm ${a.status === 'repairing' ? 'text-orange-400' : 'text-gray-100'} leading-snug line-clamp-4">${esc(directive)}</p>
        </div>
        <div class="grid grid-cols-4 gap-1.5 text-center">
          <div class="ro-stat"><span>Done</span><span class="text-sm font-bold text-green-400">${a.missions_completed}</span></div>
          <div class="ro-stat"><span>Failed</span><span class="text-sm font-bold text-red-400">${a.missions_failed}</span></div>
          <div class="ro-stat"><span>Streak</span><span class="text-sm font-bold text-primary">${a.streak}x</span></div>
          <div class="ro-stat"><span>Cost</span><span class="text-sm font-bold text-gray-100">$${Number(a.cost_usd || 0).toFixed(2)}</span></div>
        </div>
        ${actionButton(a)}
      </div>
    </div>`;
  }).join('');
}

function setFilter(f) { currentFilter = f; loadRoster(); }

loadRoster();
setInterval(loadRoster, 5000);
</script>
</body></html>
