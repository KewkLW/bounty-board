<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Wasteland Command</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,100..900;1,100..900&family=Permanent+Marker&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<script src="/avatars.js"></script>
<script>
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        "primary": "#0ddff2",
        "background-dark": "#102122",
        "danger": "#ff3e3e",
        "warning": "#fcd34d",
        "botched": "#4a4a4a",
      },
      fontFamily: {
        "display": ["Epilogue", "sans-serif"],
        "hand": ["Permanent Marker", "cursive"],
      },
      boxShadow: {
        'comic': '4px 4px 0px 0px #000000',
        'comic-hover': '6px 6px 0px 0px #000000',
        'comic-sm': '2px 2px 0px 0px #000000',
      },
    },
  },
}
</script>
<style>
body { background-color: #102122; }
.cel-border { border: 3px solid #111; }
.cel-border-thick { border: 4px solid #000; }
.grunge-overlay {
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
  pointer-events: none;
}
@keyframes flicker {
  0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; text-shadow: 0 0 5px #ff3e3e; }
  20%, 24%, 55% { opacity: 0.5; text-shadow: none; }
}
.animate-hazard { animation: flicker 4s infinite; }
.tilt-1 { transform: rotate(-1deg); }
.tilt-2 { transform: rotate(1deg); }
::-webkit-scrollbar { width: 12px; height: 12px; }
::-webkit-scrollbar-track { background: #102122; border-left: 3px solid #000; }
::-webkit-scrollbar-thumb { background: #333; border: 2px solid #000; }
::-webkit-scrollbar-thumb:hover { background: #0ddff2; }
.clip-tech { clip-path: polygon(0 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%); }
.bg-stripes { background: repeating-linear-gradient(45deg, #000 0, #000 10px, #ff3e3e 10px, #ff3e3e 20px); }
</style>
</head>
<body class="bg-background-dark min-h-screen text-white font-display overflow-hidden flex flex-col relative selection:bg-primary selection:text-black">
<div class="grunge-overlay absolute inset-0 z-50 mix-blend-overlay"></div>

<!-- Header -->
<header class="relative z-10 w-full px-6 py-4 flex items-center justify-between bg-background-dark border-b-4 border-black shadow-comic h-20">
  <div class="flex items-center gap-4">
    <div class="bg-primary p-2 cel-border transform -rotate-2">
      <span class="material-icons text-black text-3xl font-bold">terminal</span>
    </div>
    <div>
      <h1 class="text-3xl font-black uppercase tracking-tighter text-white italic transform skew-x-[-10deg]" style="-webkit-text-stroke: 1px black;">
        Wasteland <span class="text-primary">Command</span>
      </h1>
      <div class="text-xs text-gray-400 font-mono tracking-widest uppercase">System v9.2 // Sector 7</div>
    </div>
  </div>
  <div class="hidden md:flex gap-6">
    <div class="flex items-center gap-3 bg-black/40 px-4 py-2 cel-border rounded skew-x-[-10deg]">
      <div class="w-2 h-2 bg-primary rounded-full animate-pulse shadow-[0_0_10px_#0ddff2]"></div>
      <div class="transform skew-x-[10deg]">
        <span class="text-gray-400 text-xs block font-bold">ACTIVE AGENTS</span>
        <span id="stat-agents" class="text-xl font-hand text-white">--/--</span>
      </div>
    </div>
    <a href="/leaderboard" class="flex items-center gap-3 bg-black/40 px-4 py-2 cel-border rounded skew-x-[-10deg] hover:bg-primary/10 transition-colors cursor-pointer">
      <span class="material-icons text-warning text-sm">emoji_events</span>
      <div class="transform skew-x-[10deg]">
        <span class="text-gray-400 text-xs block font-bold">TOTAL LOOT</span>
        <span id="stat-loot" class="text-xl font-hand text-warning">$--</span>
      </div>
    </a>
    <div class="flex items-center gap-3 bg-danger/10 px-4 py-2 cel-border border-danger rounded skew-x-[-10deg]">
      <span class="material-icons text-danger animate-hazard text-sm">warning</span>
      <div class="transform skew-x-[10deg]">
        <span class="text-danger text-xs block font-bold">CRITICAL BUGS</span>
        <span id="stat-bugs" class="text-xl font-hand text-danger animate-hazard">--</span>
      </div>
    </div>
  </div>
  <div class="flex items-center gap-4">
    <button onclick="showNewBountyModal()" class="bg-primary hover:bg-white text-black font-bold py-2 px-6 cel-border shadow-comic hover:shadow-comic-hover transition-all transform hover:-translate-y-1 uppercase tracking-wider text-sm clip-tech">
      New Bounty
    </button>
  </div>
</header>

<!-- Filter Bar -->
<div class="relative z-10 px-6 py-3 flex gap-3 border-b-2 border-black/50 bg-background-dark/80">
  <button onclick="setFilter('all')" class="filter-btn active text-xs font-bold uppercase px-3 py-1 cel-border bg-primary text-black" data-filter="all">All Bounties</button>
  <button onclick="setFilter('bug')" class="filter-btn text-xs font-bold uppercase px-3 py-1 cel-border bg-gray-800 text-danger hover:bg-danger/20" data-filter="bug">Bug Hunts</button>
  <button onclick="setFilter('task')" class="filter-btn text-xs font-bold uppercase px-3 py-1 cel-border bg-gray-800 text-primary hover:bg-primary/20" data-filter="task">Contracts</button>
</div>

<!-- Main Kanban -->
<main class="relative z-10 flex-1 overflow-x-auto overflow-y-hidden p-6">
  <div class="flex h-full gap-6 min-w-[1200px]">
    <!-- WANTED (Pending) -->
    <div class="flex-1 flex flex-col min-w-[280px] h-full">
      <div class="mb-4 relative">
        <div class="absolute -top-3 -left-2 bg-primary text-black font-bold px-2 py-0.5 text-xs cel-border transform -rotate-3 z-20 shadow-sm">DEV_QUEUE</div>
        <div class="bg-[#1a2e30] p-4 cel-border shadow-comic border-t-[6px] border-t-primary">
          <h2 class="text-xl font-black text-primary tracking-wide uppercase flex justify-between items-center">
            Wanted <span id="count-pending" class="bg-primary/20 text-primary text-xs px-2 py-1 rounded font-mono">0</span>
          </h2>
        </div>
      </div>
      <div id="col-pending" class="flex-1 overflow-y-auto pr-2 space-y-4 pb-4"></div>
    </div>

    <!-- BUG TRACKER (Pending Bugs) -->
    <div class="flex-1 flex flex-col min-w-[280px] h-full relative">
      <div class="mb-4 relative z-10">
        <div class="bg-stripes h-2 w-full border-x-4 border-t-4 border-black"></div>
        <div class="bg-[#2a1515] p-4 border-x-4 border-b-4 border-black shadow-comic">
          <h2 class="text-xl font-black text-danger tracking-wide uppercase flex justify-between items-center animate-hazard">
            <span class="flex items-center gap-2"><span class="material-icons">bug_report</span> Bug Tracker</span>
            <span id="count-bugs" class="bg-danger/20 text-danger border border-danger text-xs px-2 py-1 font-mono">0</span>
          </h2>
        </div>
      </div>
      <div id="col-bugs" class="flex-1 overflow-y-auto pr-2 space-y-4 pb-4 z-10"></div>
    </div>

    <!-- IN PROGRESS -->
    <div class="flex-1 flex flex-col min-w-[280px] h-full">
      <div class="mb-4 relative">
        <div class="bg-[#262626] p-4 cel-border shadow-comic border-b-4 border-b-gray-400">
          <h2 class="text-xl font-black text-gray-200 tracking-wide uppercase flex justify-between items-center">
            Hunting <span class="material-icons text-gray-500 animate-spin" style="animation-duration: 3s;">settings</span>
          </h2>
        </div>
      </div>
      <div id="col-progress" class="flex-1 overflow-y-auto pr-2 space-y-4 pb-4"></div>
    </div>

    <!-- FRAGGED (Done) -->
    <div class="flex-1 flex flex-col min-w-[280px] h-full">
      <div class="mb-4 relative">
        <div class="bg-[#1a2e1a] p-4 cel-border shadow-comic border-t-[6px] border-t-green-600">
          <h2 class="text-xl font-black text-green-400 tracking-wide uppercase flex justify-between items-center">
            Fragged <span id="count-done" class="bg-green-400/20 text-green-400 text-xs px-2 py-1 rounded font-mono">0</span>
          </h2>
        </div>
      </div>
      <div id="col-done" class="flex-1 overflow-y-auto pr-2 space-y-4 pb-4 opacity-80 hover:opacity-100 transition-opacity"></div>
    </div>

    <!-- BOTCHED (Failed) -->
    <div class="flex-1 flex flex-col min-w-[280px] h-full">
      <div class="mb-4 relative">
        <div class="bg-botched p-4 cel-border shadow-comic relative overflow-hidden">
          <div class="absolute inset-0 bg-[repeating-linear-gradient(45deg,transparent,transparent_5px,#000_5px,#000_10px)] opacity-10"></div>
          <h2 class="text-xl font-black text-gray-400 tracking-wide uppercase flex justify-between items-center line-through decoration-4 decoration-black">
            Botched <span class="material-icons text-gray-600">block</span>
          </h2>
        </div>
      </div>
      <div id="col-failed" class="flex-1 overflow-y-auto pr-2 space-y-4 pb-4"></div>
    </div>
  </div>
</main>

<!-- Bottom Nav -->
<div class="fixed bottom-0 left-0 w-full z-50 px-4 pb-4">
  <div class="container mx-auto max-w-4xl">
    <div class="bg-gray-900 cel-border shadow-comic p-2 flex items-center justify-center gap-2 md:gap-4 relative">
      <a href="/" class="flex-1 bg-primary text-black border-2 border-black p-3 md:p-4 shadow-[inset_0_0_20px_rgba(255,255,255,0.4)] relative -mt-4 transform scale-110 z-10">
        <div class="flex flex-col items-center justify-center">
          <span class="material-icons text-3xl">dashboard</span>
          <span class="text-xs uppercase font-black mt-1 tracking-widest hidden md:block">Board</span>
        </div>
      </a>
      <a href="/roster" class="flex-1 bg-gray-800 hover:bg-gray-700 text-gray-300 border-2 border-black p-3 md:p-4 transition-all group">
        <div class="flex flex-col items-center justify-center">
          <span class="material-icons text-2xl group-hover:text-white">people_alt</span>
          <span class="text-[10px] uppercase font-bold mt-1 tracking-widest hidden md:block">Roster</span>
        </div>
      </a>
      <a href="/leaderboard" class="flex-1 bg-gray-800 hover:bg-gray-700 text-gray-300 border-2 border-black p-3 md:p-4 transition-all group">
        <div class="flex flex-col items-center justify-center">
          <span class="material-icons text-2xl group-hover:text-white">emoji_events</span>
          <span class="text-[10px] uppercase font-bold mt-1 tracking-widest hidden md:block">Leaderboard</span>
        </div>
      </a>
    </div>
  </div>
</div>

<!-- New Bounty Modal -->
<div id="modal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/80">
  <div class="bg-[#1a2e30] cel-border-thick shadow-comic p-6 w-full max-w-md">
    <h2 class="text-2xl font-black text-primary uppercase mb-4">Post New Bounty</h2>
    <form id="bountyForm" class="space-y-4">
      <div>
        <label class="text-xs text-gray-400 uppercase font-bold">Title</label>
        <input id="f-title" class="w-full bg-black text-white p-2 cel-border font-mono" placeholder="Bounty title..." required>
      </div>
      <div>
        <label class="text-xs text-gray-400 uppercase font-bold">Description</label>
        <textarea id="f-desc" class="w-full bg-black text-white p-2 cel-border font-mono h-20" placeholder="Details..."></textarea>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="text-xs text-gray-400 uppercase font-bold">Type</label>
          <select id="f-type" class="w-full bg-black text-white p-2 cel-border">
            <option value="task">CONTRACT (Task)</option>
            <option value="bug">BUG HUNT (Bug)</option>
          </select>
        </div>
        <div>
          <label class="text-xs text-gray-400 uppercase font-bold">Tier</label>
          <select id="f-tier" class="w-full bg-black text-white p-2 cel-border">
            <option value="C">C - Scrap Work ($150)</option>
            <option value="B">B - Salvage Run ($750)</option>
            <option value="A">A - Merc Contract ($2,000)</option>
            <option value="S">S - Black Ops ($5,000)</option>
          </select>
        </div>
      </div>
      <div>
        <label class="text-xs text-gray-400 uppercase font-bold">Priority</label>
        <select id="f-priority" class="w-full bg-black text-white p-2 cel-border">
          <option value="normal">Normal</option>
          <option value="low">Low</option>
          <option value="high">High</option>
          <option value="critical">Critical</option>
        </select>
      </div>
      <div class="flex gap-4 pt-2">
        <button type="submit" class="flex-1 bg-primary text-black font-bold py-2 cel-border shadow-comic hover:shadow-comic-hover uppercase">Post Bounty</button>
        <button type="button" onclick="hideModal()" class="flex-1 bg-gray-700 text-white font-bold py-2 cel-border uppercase">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script>
const API = '';
let currentFilter = 'all';

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.remove('bg-primary', 'text-black');
    b.classList.add('bg-gray-800');
  });
  const btn = document.querySelector(`[data-filter="${f}"]`);
  btn.classList.add('bg-primary', 'text-black');
  btn.classList.remove('bg-gray-800');
  loadBoard();
}

function showNewBountyModal() { document.getElementById('modal').classList.remove('hidden'); document.getElementById('modal').classList.add('flex'); }
function hideModal() { document.getElementById('modal').classList.add('hidden'); document.getElementById('modal').classList.remove('flex'); }

function tierColor(tier) {
  return { S: 'text-yellow-400 border-yellow-400', A: 'text-orange-400 border-orange-400', B: 'text-blue-400 border-blue-400', C: 'text-gray-400 border-gray-400' }[tier] || '';
}

function priorityBadge(p) {
  const colors = { critical: 'bg-danger/20 text-danger border-danger', high: 'bg-orange-500/20 text-orange-400 border-orange-500/50', normal: 'bg-gray-700 text-gray-300 border-gray-600', low: 'bg-gray-800 text-gray-500 border-gray-700' };
  return `<span class="text-[10px] px-1.5 py-0.5 border ${colors[p] || colors.normal} uppercase font-bold">${p}</span>`;
}

function makeCard(b, variant) {
  const isBug = b.type === 'bug';
  const borderColor = isBug ? 'border-l-danger' : 'border-l-primary';
  const tierBadge = `<span class="text-[10px] px-1.5 py-0.5 border ${tierColor(b.tier)} font-bold">${b.tier} - ${b.tier_name || ''}</span>`;
  const reward = `<span class="font-hand text-sm ${isBug ? 'text-danger' : 'text-primary'}">$${b.reward.toLocaleString()} XP</span>`;

  if (variant === 'pending') {
    return `<div class="group bg-[#162628] p-4 cel-border relative shadow-comic hover:shadow-comic-hover transition-all duration-200 hover:-translate-y-1 border-l-[6px] ${borderColor} clip-tech">
      ${isBug ? '<div class="absolute -right-2 -top-3 rotate-6 bg-danger text-black font-black px-2 py-1 text-xs border-2 border-black">BUG</div>' : ''}
      <div class="flex justify-between items-start mb-2">
        <span class="${isBug ? 'text-danger/70' : 'text-primary/70'} font-mono text-xs">${b.ticket_id}</span>
        ${reward}
      </div>
      <h3 class="text-white font-bold text-lg mb-2 leading-tight group-hover:${isBug ? 'text-danger' : 'text-primary'} transition-colors">${b.title}</h3>
      <p class="text-xs text-gray-500 mb-3 font-mono leading-snug line-clamp-2">${b.description || ''}</p>
      <div class="flex items-center justify-between border-t-2 border-black/30 pt-3 border-dashed">
        <div class="flex gap-2">${tierBadge} ${priorityBadge(b.priority)}</div>
      </div>
    </div>`;
  }

  if (variant === 'progress') {
    return `<div class="bg-[#222] p-4 cel-border relative shadow-comic hover:shadow-comic-hover transition-all duration-200">
      <div class="flex justify-between items-center mb-2">
        ${isBug ? '<span class="bg-danger text-black text-[10px] font-bold px-1.5 py-0.5 border border-black">BUG HUNT</span>' : '<span class="bg-primary text-black text-[10px] font-bold px-1.5 py-0.5 border border-black">CONTRACT</span>'}
        <span class="${isBug ? 'text-danger' : 'text-primary'} font-mono text-xs">${b.progress}%</span>
      </div>
      <h3 class="text-white font-bold text-lg mb-3 leading-tight">${b.title}</h3>
      <div class="relative w-full h-3 bg-black border-2 border-gray-600 mb-3 skew-x-[-10deg]">
        <div class="absolute top-0 left-0 h-full ${isBug ? 'bg-danger' : 'bg-primary'}" style="width:${b.progress}%"></div>
      </div>
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="w-6 h-6 bg-gray-700 cel-border overflow-hidden flex items-center justify-center">${b.claimed_by && window.AgentAvatars ? '<img src="'+AgentAvatars.getUrl(b.claimed_by, 30)+'" class="w-full h-full object-cover"/>' : '<span class="text-[10px] font-bold text-primary">'+(b.agent_name || '?')[0]+'</span>'}</div>
          <span class="text-gray-400 font-hand text-sm">${b.agent_name || 'Unknown'}</span>
        </div>
        ${reward}
      </div>
    </div>`;
  }

  if (variant === 'done') {
    return `<div class="bg-[#1a2a1a] p-4 cel-border relative shadow-comic opacity-70 hover:opacity-100 transition-opacity">
      <div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-30 z-10">
        <div class="border-4 border-green-600 p-2 transform -rotate-12 rounded-lg">
          <span class="text-3xl font-black text-green-600 uppercase tracking-widest">DONE</span>
        </div>
      </div>
      <div class="flex justify-between items-start mb-2">
        <span class="text-gray-500 font-mono text-xs">${b.ticket_id}</span>
        <span class="text-gray-500 font-hand text-sm line-through">$${b.reward.toLocaleString()} XP</span>
      </div>
      <h3 class="text-gray-400 font-bold text-lg mb-2 line-through decoration-2 decoration-green-700">${b.title}</h3>
      <div class="flex items-center justify-between pt-2">
        <div class="flex items-center gap-1">${b.claimed_by && window.AgentAvatars ? '<img src="'+AgentAvatars.getUrl(b.claimed_by, 20)+'" class="w-5 h-5 border border-gray-600"/>' : ''}<span class="text-xs text-gray-500">${b.agent_name || ''}</span></div>
        <span class="material-icons text-green-600">check_circle</span>
      </div>
    </div>`;
  }

  if (variant === 'failed') {
    return `<div class="bg-[#1a1a1a] p-4 cel-border relative shadow-comic opacity-70 hover:opacity-100 transition-opacity grayscale hover:grayscale-0 group">
      <div class="absolute -top-3 left-1/2 -translate-x-1/2 w-16 h-6 bg-gray-400/80 transform rotate-2 z-10 shadow-sm border border-white/20"></div>
      <div class="flex justify-between items-start mb-2">
        <span class="text-xs font-bold text-red-500 border border-red-500 px-1 rounded-sm">BOTCHED</span>
        <span class="text-gray-600 font-mono text-xs">${b.ticket_id}</span>
      </div>
      <h3 class="text-gray-400 font-bold text-lg mb-2 line-through decoration-2 decoration-red-900">${b.title}</h3>
      ${b.error_log ? `<div class="bg-black p-2 font-mono text-[10px] text-red-400 border border-gray-700 mb-3 overflow-hidden whitespace-pre-line">${b.error_log}</div>` : ''}
      <div class="flex justify-between items-center">
        <div class="flex items-center gap-1">${b.claimed_by && window.AgentAvatars ? '<img src="'+AgentAvatars.getUrl(b.claimed_by, 20)+'" class="w-5 h-5 border border-gray-600"/>' : ''}<span class="font-hand text-gray-600 text-sm">${b.agent_name || ''}</span></div>
        <button onclick="retryBounty(${b.id})" class="text-xs bg-gray-700 hover:bg-white hover:text-black px-2 py-1 border border-black transition-colors">RETRY</button>
      </div>
    </div>`;
  }
}

async function loadBoard() {
  const [bounties, stats] = await Promise.all([
    fetch(`${API}/api/bounties`).then(r => r.json()),
    fetch(`${API}/api/bounties/stats`).then(r => r.json())
  ]);

  // Update stats
  document.getElementById('stat-agents').textContent = `${stats.active_agents}/${stats.total_agents}`;
  document.getElementById('stat-loot').textContent = `$${(stats.total_loot_earned || 0).toLocaleString()}`;
  document.getElementById('stat-bugs').textContent = String(stats.critical_bugs || 0).padStart(2, '0');

  // Filter
  const filtered = currentFilter === 'all' ? bounties : bounties.filter(b => b.type === currentFilter);

  // Split into columns
  const pendingTasks = filtered.filter(b => b.status === 'pending' && b.type === 'task');
  const pendingBugs = filtered.filter(b => b.status === 'pending' && b.type === 'bug');
  const inProgress = filtered.filter(b => b.status === 'in_progress');
  const done = filtered.filter(b => b.status === 'done');
  const failed = filtered.filter(b => b.status === 'failed');

  document.getElementById('count-pending').textContent = String(pendingTasks.length).padStart(2, '0');
  document.getElementById('count-bugs').textContent = String(pendingBugs.length).padStart(2, '0');
  document.getElementById('count-done').textContent = String(done.length).padStart(2, '0');

  document.getElementById('col-pending').innerHTML = pendingTasks.map(b => makeCard(b, 'pending')).join('') || '<div class="text-gray-600 text-center font-mono text-sm p-4">No contracts posted</div>';
  document.getElementById('col-bugs').innerHTML = pendingBugs.map(b => makeCard(b, 'pending')).join('') || '<div class="text-gray-600 text-center font-mono text-sm p-4">No bugs reported</div>';
  document.getElementById('col-progress').innerHTML = inProgress.map(b => makeCard(b, 'progress')).join('') || '<div class="text-gray-600 text-center font-mono text-sm p-4">All agents idle</div>';
  document.getElementById('col-done').innerHTML = done.map(b => makeCard(b, 'done')).join('') || '<div class="text-gray-600 text-center font-mono text-sm p-4">Nothing fragged yet</div>';
  document.getElementById('col-failed').innerHTML = failed.map(b => makeCard(b, 'failed')).join('') || '<div class="text-gray-600 text-center font-mono text-sm p-4">Clean record</div>';
}

async function retryBounty(id) {
  await fetch(`${API}/api/bounties/${id}/retry`, { method: 'POST' });
  loadBoard();
}

document.getElementById('bountyForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  await fetch(`${API}/api/bounties`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      title: document.getElementById('f-title').value,
      description: document.getElementById('f-desc').value,
      type: document.getElementById('f-type').value,
      tier: document.getElementById('f-tier').value,
      priority: document.getElementById('f-priority').value,
    })
  });
  hideModal();
  document.getElementById('bountyForm').reset();
  loadBoard();
});

// Initial load + auto-refresh every 5s
loadBoard();
setInterval(loadBoard, 5000);
</script>
</body></html>
