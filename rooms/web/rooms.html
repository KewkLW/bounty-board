<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Rooms</title>
<link rel="stylesheet" href="/base.css">
<style>
  .list { max-width: 820px; margin: 30px auto; padding: 0 14px; }
  .list h1 { font: 600 24px var(--font-display); }
  .room { display: block; padding: 14px 16px; margin: 0 0 10px; background: var(--panel); border: 1px solid var(--panel-edge);
    border-radius: var(--radius); color: var(--text); text-decoration: none; }
  .room:hover { border-color: var(--accent); }
  .room b { font-size: 17px; } .room p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .room .meta { float: right; font-size: 12px; color: var(--muted); }
  .room.closed { opacity: .6; }
</style>
</head>
<body>
<div class="list">
  <h1>Agent Rooms</h1>
  <div id="rooms">Loading…</div>
</div>
<script>
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
async function load() {
  const rooms = await (await fetch('/api/rooms')).json();
  rooms.sort((a, b) => (!!a.closed - !!b.closed) || b.created.localeCompare(a.created));
  document.getElementById('rooms').innerHTML = rooms.length ? rooms.map((r) => `
    <a class="room ${r.closed ? 'closed' : ''}" href="/r/${esc(r.id)}/">
      <span class="meta">${r.closed ? 'closed' : `${r.online}/${r.members} online`} · ${r.last_seq} msgs</span>
      <b>${esc(r.name)}</b>${r.project ? ` <small>${esc(r.project)}</small>` : ''}
      <p>${esc(r.purpose)}</p></a>`).join('') : '<p>No rooms yet.</p>';
}
load(); setInterval(load, 15000);
</script>
</body>
</html>
